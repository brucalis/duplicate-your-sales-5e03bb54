name: Add hero image

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update:
    if: "!contains(github.event.head_commit.message, '[skip hero-image]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Replace hero placeholder with image
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/routes/index.tsx')
          text = path.read_text(encoding='utf-8')

          old = '''          <div className="glass-strong relative rounded-[2rem] p-3 shadow-glow">
            <Placeholder
              label="[Imagem Hero / VSL]"
              hint="Vídeo ou print grande da interface da Super Lovable aberta"
              aspect="aspect-[4/3]"
              className="rounded-[1.5rem]"
            />
          </div>'''

          new = '''          <div className="glass-strong relative overflow-hidden rounded-[2rem] p-3 shadow-glow">
            <img
              src="https://i.ibb.co/207QK2KP/0791a1d2-6dd6-4919-9481-91cf34a9312a-1.png"
              alt="Interface da Super Lovable"
              referrerPolicy="no-referrer"
              className="aspect-[4/3] w-full rounded-[1.5rem] object-cover"
              loading="eager"
            />
          </div>'''

          if old not in text:
              raise SystemExit('Hero placeholder block not found')

          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Commit changes and remove workflow
        run: |
          rm .github/workflows/add-hero-image.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routes/index.tsx .github/workflows/add-hero-image.yml
          git commit -m "feat: adiciona imagem na hero mantendo borda sombreada [skip hero-image]"
          git push
